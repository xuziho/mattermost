{{define "unsupported_desktop_app"}}
    <!DOCTYPE html>
    <html>
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <base href="{{.Props.Subpath}}">
            <title>{{.Props.Title}}</title>
            <style>
                @font-face {
                    font-family: 'Metropolis';
                    src: url("static/fonts/Metropolis-SemiBold.woff") format('woff');
                    font-weight: 600;
                    font-style: normal;
                }
                * {
                    box-sizing: border-box;
                }
                body {
                    margin: 0;
                    min-height: 100vh;
                    font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                    -webkit-font-smoothing: antialiased;
                    display: flex;
                    flex-direction: column;
                    background-color: #F0F0F0;
                    background-image: url("static/images/admin-onboarding-background.jpg");
                    background-size: cover;
                    background-position: center;
                    background-repeat: no-repeat;
                }
                .header {
                    padding: 36px 0 0 40px;
                }
                .logo {
                    display: block;
                    width: 170px;
                    height: 30px;
                }
                .main {
                    flex: 1;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    padding: 24px 40px 80px;
                }
                .content {
                    text-align: center;
                    max-width: 560px;
                }
                .warning-icon {
                    display: block;
                    width: 189.133px;
                    height: 150px;
                    margin: 0 auto 24px;
                }
                .title {
                    margin: 0 0 16px;
                    font-family: 'Metropolis', sans-serif;
                    font-size: 40px;
                    font-weight: 600;
                    line-height: 48px;
                    letter-spacing: -0.8px;
                    color: #1E325C;
                }
                .message {
                    margin: 0 0 24px;
                    font-size: 16px;
                    line-height: 1.5;
                    color: rgba(63, 67, 80, 0.72);
                }
                .message a {
                    color: #2389D7;
                    text-decoration: underline;
                }
                .message a:hover {
                    color: #1C6FBC;
                }
                .assistance {
                    margin: 0;
                    font-size: 14px;
                    line-height: 1.4;
                    color: rgba(63, 67, 80, 0.64);
                }
                .footer {
                    display: inline-flex;
                    align-items: center;
                    padding: 16px 40px;
                    font-size: 11px;
                    line-height: 16px;
                    letter-spacing: 0.22px;
                    color: rgba(63, 67, 80, 0.56);
                }
            </style>
            <style>
                @font-face {
                    font-family: 'Open Sans';
                    font-style: normal;
                    font-weight: 400;
                    src:
                        url("static/fonts/open-sans-v18-vietnamese_latin-ext_latin_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2") format('woff2'),
                        url("static/fonts/open-sans-v18-vietnamese_latin-ext_latin_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff") format('woff');
                }
                @font-face {
                    font-family: 'Open Sans';
                    font-style: normal;
                    font-weight: 600;
                    src:
                        url("static/fonts/open-sans-v18-vietnamese_latin-ext_latin_greek-ext_greek_cyrillic-ext_cyrillic-600.woff2") format('woff2'),
                        url("static/fonts/open-sans-v18-vietnamese_latin-ext_latin_greek-ext_greek_cyrillic-ext_cyrillic-600.woff") format('woff');
                }
            </style>
        </head>
        <body>
            <header class="header">
                <div class="logo">{{.Props.SiteName}}</div>
            </header>
            <main class="main">
                <div class="content">
                    <img class="warning-icon" src="static/images/alert.svg" alt="" />
                    <h1 class="title">{{.Props.Title}}</h1>
                    <div class="message">{{.Props.MessageString}}</div>
                    <p class="assistance">{{.Props.AssistanceString}}</p>
                </div>
            </main>
            <footer class="footer">
                <span>© {{.Props.CopyrightYear}} {{.Props.SiteName}}</span>
            </footer>
        </body>
    </html>
{{end}}
